<!DOCTYPE html>
<html lang="ru">
<script src="js.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный калькулятор</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="calculator">
    <h1>Калькулятор</h1>
    <input type="text" id="input1" placeholder="Введите первое число">
    <input type="text" id="input2" placeholder="Введите второе число">
    <div class="buttons">
        <button id="sum-btn">Сумма</button>
        <button id="subtract-btn">Разность</button>
        <button id="multiply-btn">Произведение</button>
        <button id="divide-btn">Деление</button>
    </div>
    <div class="result" id="result"></div>
</div>
</body>
</html>
